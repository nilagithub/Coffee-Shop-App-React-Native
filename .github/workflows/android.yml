name: Build nexschool APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag creator
        run: |
          echo "Tag pushed by: ${{ github.actor }}"
          ALLOWED_USERS="satnamSandhu2001 nilagithub"

          if ! echo "$ALLOWED_USERS" | grep -qw "${{ github.actor }}"; then
            echo "❌ Unauthorized tag creator: ${{ github.actor }}"
            exit 1
          fi
          echo "Authorized"

      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Set up SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 31
          build-tools: 31.0.0

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Decode the keystore file
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/nexschool.keystore

      # Add keystore.properties
      - name: Add keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > android/keystore.properties

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # Upload APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
